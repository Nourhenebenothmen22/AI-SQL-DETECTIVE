<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Primary Cyber Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Emerald Security Gradient -->
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Violet Neural Gradient -->
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Radial AI Core Glow -->
    <radialGradient id="ai-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hexagonal Shield / Terminal Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg-grad)" stroke="url(#border-glow)" stroke-width="1.5" />
  
  <!-- Subtle Internal Grid Matrix Accent -->
  <path d="M12 20h40M12 32h40M12 44h40" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M20 12v40M32 12v40M44 12v40" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6" />

  <!-- 1. PostgreSQL Database Disk Tier 1 (Base Layer) -->
  <path d="M15 36c0 3 6.7 5.5 15 5.5s15-2.5 15-5.5v4c0 3-6.7 5.5-15 5.5s-15-2.5-15-5.5v-4z" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" />
  <circle cx="17.5" cy="38" r="1.5" fill="url(#emerald-glow)" />

  <!-- 2. PostgreSQL Database Disk Tier 2 (Middle Layer) -->
  <path d="M15 28c0 3 6.7 5.5 15 5.5s15-2.5 15-5.5v4c0 3-6.7 5.5-15 5.5s-15-2.5-15-5.5v-4z" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="17.5" cy="30" r="1.5" fill="url(#cyan-glow)" />

  <!-- 3. PostgreSQL Database Disk Tier 3 (Top Disk) -->
  <path d="M15 20c0 3 6.7 5.5 15 5.5s15-2.5 15-5.5v4c0 3-6.7 5.5-15 5.5s-15-2.5-15-5.5v-4z" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />
  <ellipse cx="30" cy="20" rx="15" ry="5.5" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
  <circle cx="17.5" cy="22" r="1.5" fill="url(#violet-glow)" />

  <!-- Detective AI Glow Aura -->
  <circle cx="37" cy="31" r="14" fill="url(#ai-core-glow)" />

  <!-- Detective Magnifying Ring (Autonomous Investigator) -->
  <circle cx="37" cy="31" r="12" fill="#070A12" fill-opacity="0.75" stroke="url(#cyan-glow)" stroke-width="2.5" />
  
  <!-- Optical Scan Arc Accent -->
  <path d="M29 25a12 12 0 0 1 14 -3" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- AI Cognitive Lens Core (SQL Prompt Query Aperture) -->
  <circle cx="37" cy="31" r="4.5" fill="#0F172A" stroke="url(#emerald-glow)" stroke-width="1.5" />
  <!-- Spark Core Node -->
  <path d="M37 28v6M34 31h6" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="37" cy="31" r="1.2" fill="#FFFFFF" />

  <!-- Detective Lens Handle / Probe Conduit -->
  <path d="M45.5 39.5L53 47" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" />
  <path d="M48 42l4 4" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="53" cy="47" r="2" fill="url(#emerald-glow)" />
</svg>
