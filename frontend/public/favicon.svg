<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#fav-bg)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Database Tier base -->
  <path d="M7 19c0 1.8 3.8 3.2 8.5 3.2s8.5-1.4 8.5-3.2v2c0 1.8-3.8 3.2-8.5 3.2s-8.5-1.4-8.5-3.2v-2z" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
  
  <!-- Database Tier top -->
  <ellipse cx="15.5" cy="11.5" rx="8.5" ry="3.2" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.6" />
  
  <!-- Detective Eye / Magnifying Lens -->
  <circle cx="19" cy="17" r="6.5" fill="#070A12" stroke="url(#fav-cyan)" stroke-width="1.8" />
  <circle cx="19" cy="17" r="2.2" fill="url(#fav-emerald)" />
  <circle cx="19" cy="17" r="0.8" fill="#FFFFFF" />
  
  <!-- Detective handle -->
  <path d="M23.5 21.5L27.5 25.5" stroke="url(#fav-cyan)" stroke-width="2" stroke-linecap="round" />
</svg>
