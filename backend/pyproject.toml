[project]
name = "ai-sql-detective-backend"
version = "0.1.0"
description = "AI SQL Detective — Modular Monolith FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "langchain>=0.3.0,<2.0.0",
    "langchain-openai>=0.3.0,<2.0.0",
    "langgraph>=0.3.0,<2.0.0",
    "langsmith>=0.3.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "sqlglot>=26.0.0,<28.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.3.0,<2.0.0",
]
google = [
    "langchain-google-genai>=2.0.0,<5.0.0",
]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running PostgreSQL 16 instance",
]
